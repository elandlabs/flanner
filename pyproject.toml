[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flanner"
version = "0.14.0"
description = "Plan file management for AI assistants via MCP"
authors = [{ name = "Jayson Mulwa", email = "jayson.mulwa@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "claude", "codex", "ai-agents", "plan-files", "markdown", "cli", "planning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=13.0,<16",
    "sqlalchemy>=2.0,<3",
    "python-frontmatter>=1.0,<2",
    "pyyaml>=6.0,<7",
    "fastapi>=0.104,<1",
    "uvicorn>=0.24,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.6,<0.1",
    "markdown>=3.5,<4",
    "nh3>=0.2,<1",
    "pygments>=2.17,<3",
    "pydantic>=2.5,<3",
    "mcp>=1.0,<2",
    "cryptography>=42,<51",
    # The device key lives in the OS keychain. Unconditional: every desktop
    # platform has a backend, and where one is missing (headless Linux with
    # no Secret Service, containers, CI) `identity` falls back to the 0600
    # file it always used, so the import failing softly is already handled.
    "keyring>=25,<26",
    # Direct peer transport. Required only where the project publishes a
    # wheel, because it publishes no sdist: without a marker, pip on an
    # unsupported platform fails with "could not find a version", which
    # reads as a broken package rather than an unsupported machine.
    #
    # Absent, the client still works. Peer sync falls back to an http
    # address and `flanner peer serve --http`, and every entry point says
    # so rather than raising.
    #
    # Not expressible here: musl. On Alpine the manylinux wheel does not
    # match and the install fails anyway. Only upstream can fix it; the
    # request is drafted in docs/upstream-iroh-musllinux.md. See the README.
    "iroh>=1.1,<2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "iroh>=1.1,<2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "iroh>=1.1,<2; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "iroh>=1.1,<2; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0,<9",
    # A test that hangs fails instead of holding the runner until the job
    # limit. An outside review saw the iroh suite not terminate in a
    # sandbox with no network; it passes in 22s here, and either way the
    # right outcome is a red test naming itself, not a stalled workflow.
    "pytest-timeout>=2.3,<3",
    "httpx>=0.25,<1",
    "ruff>=0.8",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.5",
    # Property-based tests for the protocol invariants: canonical
    # serialisation, signature round-trips, device-id derivation.
    "hypothesis>=6.100,<7",
    "types-PyYAML",
    "types-Markdown",
    # The browser suite. Pinned to a minor: the Playwright version decides
    # which Chromium build `playwright install` fetches, so a browser
    # upgrade is a deliberate commit rather than a Tuesday.
    "playwright>=1.63,<1.64",
    "pytest-playwright>=0.9,<1",
]

[project.scripts]
flanner = "flanner.cli:main"
flanner-mcp = "flanner.server:main"

[project.urls]
Homepage = "https://flanner.io"
Repository = "https://github.com/jaysonmulwa/flanner"
Changelog = "https://github.com/jaysonmulwa/flanner/blob/main/CHANGELOG.md"
Issues = "https://github.com/jaysonmulwa/flanner/issues"

[tool.mypy]
strict = true
python_version = "3.10"
warn_unreachable = true

# The conformance suite ships in the package so adapter authors outside this
# repository can run it, but it is a pytest suite: it takes provider objects
# as `object` on purpose, because the whole point is that it must not know
# any concrete implementation.
[[tool.mypy.overrides]]
module = "flanner.mesh_conformance"
ignore_errors = true

# python-frontmatter ships no py.typed and has no stubs on typeshed. The
# narrowest possible admission: this says nothing about our own code, and
# the two values we take from it are converted at the call site rather
# than trusted.
[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
[tool.ruff.lint.per-file-ignores]
# assert, hardcoded tmp paths, and a 0.0.0.0 bind literal (to test the
# non-local-bind warning) are fine in tests and benchmarks
"tests/*" = ["S101", "S104", "S105", "S107", "S108", "S603", "S607"]
# A test suite that happens to be packaged, so adapter authors can run it.
"flanner/mesh_conformance.py" = ["S101"]
"benchmarks/*" = ["S101", "S603", "S607"]

[tool.setuptools.packages.find]
include = ["flanner*"]

[tool.setuptools.package-data]
# py.typed: the package is checked under mypy --strict, so downstream
# consumers should get its types rather than an untyped stub.
flanner = ["py.typed", "web/templates/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
# Per test. The slowest genuine test is under a minute; five minutes is a
# hang detector, not a performance gate.
timeout = 300
# `browser` is opt-in: it needs a Chromium build and a uvicorn subprocess,
# so every existing job runs `-m "not browser"` and measures what it always
# did. `pytest -m browser` is the new job, and `make browser` locally.
markers = [
    "browser: drives the local web UI in a real browser (needs `playwright install chromium`)",
]
# Opt-in in fact, not only in CI. Playwright's synchronous API leaves an
# event loop running in the test process, and every later test that calls
# asyncio.run() then fails: a plain local `pytest` failed ten. `-m browser`
# on the command line replaces this and selects them.
addopts = "-m 'not browser'"
