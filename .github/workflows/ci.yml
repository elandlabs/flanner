name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing platform must not cancel the others: the point of
      # running three is to learn which one broke.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Every supported version on Linux, and one version on each of the
        # other two platforms. Packaging, config paths, file locking and the
        # process model all differ there, and until this the first machine
        # to run the suite on Windows or a Mac was a user's. The Windows
        # run is known good: the whole suite passes on Windows locally.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check flanner/ tests/ benchmarks/
          ruff format --check flanner/ tests/ benchmarks/
      - name: Type check
        run: mypy --strict flanner/
      # The floor is a ratchet, not an aspiration: set just under where the
      # suite actually sits (86%), so a change that stops testing something
      # fails here rather than being noticed a release later. It was 80,
      # which left six points of room to quietly lose.
      # `-m "not browser"`: the browser suite has its own job below, and
      # this one measures exactly what it measured before it existed.
      - name: Tests with coverage gate
        run: pytest -m "not browser" --cov=flanner --cov-fail-under=85 -q
      - name: Audit dependencies
        run: pip-audit --skip-editable
        continue-on-error: false

  # The JavaScript, which nothing else in this repo can see. `TestClient`
  # checks that a route answers 200 and the template contains a string; it
  # cannot check that a button works, that the shell swaps without a reload,
  # or that text on a card can be read.
  #
  # Budget: 6 minutes. It runs in about 70 seconds today, seeding and server
  # start included. Past the budget, shard the journeys across two runners
  # before dropping any of them — a job that is disabled for being slow
  # covers nothing at all.
  #
  # No coverage here: these tests live under `tests/` but the gate is the
  # unit job's, and adding a second measurement would move a floor that is
  # meant to be a ratchet.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The browser build is pinned by the playwright pin in pyproject, so
      # a Chromium upgrade arrives as a commit rather than as a Tuesday.
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Browser journeys
        run: >-
          pytest -m browser -q
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --output=browser-artifacts
      - name: Keep the traces from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: browser-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # The dependency set CI itself runs on, pinned by hash.
  #
  # Deliberately *not* the runtime dependencies. This is a published library:
  # pinning what a consumer installs would force our resolution onto every
  # project that depends on us, which is the opposite of a library's job. The
  # ranges in pyproject stay ranges, and the matrix below resolves them fresh
  # so we find out when a dependency breaks us.
  #
  # What the lock buys is the toolchain: a green run is reproducible, a
  # failure is attributable to a change rather than to ruff shifting
  # underneath us, and a compromised dev package cannot slip in unnoticed.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: The lock matches what pyproject declares
        run: |
          # --no-header on both sides: uv writes the output path into the
          # header, so a plain diff compares filenames and always fails.
          uv pip compile pyproject.toml --extra dev --generate-hashes --universal --python-version 3.12 --no-header -o /tmp/expected.lock --quiet
          sed '/^#    uv pip compile/d; /^# This file was autogenerated/d' requirements-dev.lock > /tmp/committed.lock
          diff -u /tmp/committed.lock /tmp/expected.lock || {
            echo "::error::requirements-dev.lock is stale. Regenerate it:"
            echo "  uv pip compile pyproject.toml --extra dev --generate-hashes --universal --python-version 3.12 -o requirements-dev.lock"
            exit 1
          }
      - name: Every dev dependency installs at the hash it was locked at
        run: pip install --require-hashes -r requirements-dev.lock

  # A benchmark nobody compares measures a regression and says nothing.
  # The tolerance is wide on purpose — see benchmarks/bench.py.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: No order-of-magnitude regression
        run: python benchmarks/bench.py --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Install from wheel in clean venv and smoke test
        run: |
          python -m venv smoke
          smoke/bin/pip install dist/*.whl
          smoke/bin/flanner --version
          smoke/bin/python -c "import flanner.server, flanner.web, flanner.cli"
